  // MASTER SCRIPT PRESENSIKU v6.0 (DYNAMIC DASHBOARD & KIOSK FULL)

  const API_URL = '/api';
  let base64File = null;

  async function checkAuth(roleRequired = 'Employee') {
    let token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
    if (!token) { window.location.href = 'login.html'; return null; }
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (roleRequired === 'HR' && payload.role !== 'HR' && payload.role !== 'Admin' && payload.role !== 'Super Admin') {
         alert('Akses Ditolak! Halaman ini khusus HRD/Admin/Super Admin.'); window.location.href = 'dashboard.html'; return null;
      }
    } catch(e) {}
    return token;
  }

  
  
  window.unduhRekapPDF = function(btn) {
    if (!btn && window.event) btn = window.event.currentTarget;
    const oldText = btn ? btn.innerHTML : 'Unduh Rekap PDF';
    if (btn) btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin" style="animation: spin 1s linear infinite;">sync</span><span>Menyusun Data...</span>';

    const loadScript = (src, callback) => {
        if (document.querySelector('script[src="' + src + '"]')) return callback();
        const s = document.createElement('script');
        s.src = src;
        s.onload = callback;
        s.onerror = () => { alert('Gagal memuat library PDF. Cek internet Anda.'); if(btn) btn.innerHTML = oldText; };
        document.head.appendChild(s);
    };

    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => {
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js', () => {
            generatePureDataPDF(btn, oldText);
        });
    });
  };

  function generatePureDataPDF(btn, oldText) {
    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape'); 
        
        doc.setFillColor(185, 28, 28); 
        doc.rect(14, 15, 12, 12, 'F'); 
        
        doc.setTextColor(17, 17, 17);
        doc.setFontSize(20);
        doc.setFont("helvetica", "bold");
        doc.text("PT SINERGI PRESENSI MODERN", 30, 21);
        
        doc.setTextColor(80, 80, 80);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("Gedung Menara Merdeka, Jl. Jendral Sudirman Kav. 1, Jakarta Raya", 30, 27);
        doc.text("Telepon: (021) 555-0192  |  Email: hrd@sinergimodern.com", 30, 32);
        
        doc.setLineWidth(0.5);
        doc.setDrawColor(200, 200, 200);
        doc.line(14, 36, 283, 36); 
        
        doc.setTextColor(185, 28, 28);
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        let titleNode = document.querySelector('h1');
        let title = titleNode ? titleNode.innerText.toUpperCase() : "LAPORAN REKAPITULASI";
        doc.text(title, 14, 46);
        
        doc.setTextColor(100, 100, 100);
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text("Tanggal Cetak: " + new Date().toLocaleString('id-ID'), 14, 51);

        let head = [];
        let body = [];

        const table = document.querySelector('table');
        if (table) {
            const ths = Array.from(table.querySelectorAll('thead th'));
            head = [ths.map(th => th.innerText.trim()).filter(t => t.toUpperCase() !== 'AKSI')];
            
            table.querySelectorAll('tbody tr').forEach(tr => {
                const row = [];
                Array.from(tr.querySelectorAll('td')).forEach((td, i) => {
                    if (i < head[0].length) {
                        // Use split and join to safely replace newlines without regex slash issues in templates
                        row.push(td.innerText.trim().split('\n').join(' | '));
                    }
                });
                if (row.length > 0) body.push(row);
            });
        } else {
            head = [['Alasan / Tipe Pengajuan', 'Kode REQ', 'Detail Jadwal & Durasi', 'Status']];
            
            const h2s = Array.from(document.querySelectorAll('h2'));
            const header = h2s.find(h => h.innerText.includes('Riwayat') || h.innerText.includes('Status'));
            if (header) {
                const wrapper = header.closest('.flex');
                if (wrapper && wrapper.parentElement && wrapper.parentElement.nextElementSibling) {
                    const listContainer = wrapper.parentElement.nextElementSibling;
                    listContainer.querySelectorAll('.bg-surface-container-lowest').forEach(card => {
                        // 1. Tipe / Alasan (Cek versi dinamis atau statis)
                        const typeDinamis = card.querySelector('.font-bold.text-sm.text-on-surface');
                        const typeStatis = card.querySelector('.font-semibold.text-on-surface');
                        const h3 = card.querySelector('h3');
                        let reason = typeDinamis ? typeDinamis.innerText.replace('Terlampir', '').trim() : 
                                    (typeStatis ? typeStatis.innerText.trim() : 
                                    (h3 ? h3.innerText.trim() : '-'));
                        
                        // 2. Kode REQ (jika ada)
                        const reqEl = card.querySelector('.font-data-mono');
                        const reqCode = reqEl ? reqEl.innerText.trim() : '-';

                        // 3. Coba ambil detail jadwal/alasan
                        let detailStr = '-';
                        const alasanDinamis = card.querySelector('.italic.text-outline');
                        if (alasanDinamis) {
                            detailStr = alasanDinamis.innerText.trim();
                        } else {
                            const dateIcon = Array.from(card.querySelectorAll('.material-symbols-outlined')).find(i => i.innerText.includes('date_range') || i.innerText.includes('event'));
                            if (dateIcon && dateIcon.nextElementSibling) {
                                detailStr = dateIcon.nextElementSibling.innerText.trim();
                            } else {
                                const lowBox = card.querySelector('.bg-surface-container-low');
                                if (lowBox) detailStr = lowBox.innerText.split('\n').join(' ').trim();
                            }
                        }

                        // Tambahkan info handover jika ada
                        let handover = '';
                        const handoverEl = card.querySelector('.bg-surface-container-low .text-on-surface.font-medium');
                        if (handoverEl && handoverEl.innerText.includes('Handover')) {
                            handover = ' | ' + handoverEl.innerText.trim();
                        }

                        // 4. Status
                        let status = '-';
                        const badge = card.querySelector('.rounded-full');
                        if (badge) {
                            const spans = badge.querySelectorAll('span');
                            status = spans.length > 0 ? spans[spans.length - 1].innerText.trim() : badge.innerText.trim();
                        }
                        
                        body.push([reason, reqCode, detailStr + handover, status]);
                    });
                }
            }
        }

        if (body.length === 0) {
            body = [['Data Kosong', '-', '-']];
        }

        doc.autoTable({
            startY: 56,
            head: head,
            body: body,
            theme: 'grid',
            styles: { font: 'helvetica', fontSize: 9, cellPadding: 4, textColor: [40, 40, 40] },
            headStyles: { fillColor: [185, 28, 28], textColor: 255, fontStyle: 'bold', halign: 'center' },
            alternateRowStyles: { fillColor: [249, 250, 251] },
            margin: { left: 14, right: 14 }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(8);
            doc.text('Halaman ' + i + ' dari ' + pageCount, 283, 195, { align: 'right' });
            doc.text('Digenerate otomatis dari Database Presensiku', 14, 195);
        }

        doc.save('Rekap_Data_' + Date.now() + '.pdf');
        if (btn) btn.innerHTML = oldText;

    } catch (e) {
        console.error(e);
        alert("Gagal menyusun PDF murni: " + e.message);
        if (btn) btn.innerHTML = oldText;
    }
  }

  function executePDF(btn, oldText) { } // dummy fallback


const style = document.createElement('style');
  style.innerHTML = '@keyframes spin { 100% { transform: rotate(360deg); } }';
  document.head.appendChild(style);
window.toggleSidebar = function() {
    const sidebar = document.getElementById('app-sidebar') || document.getElementById('mainSidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (sidebar) {
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full'); if(backdrop) backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full'); if(backdrop) backdrop.classList.add('hidden');
      }
    }
  };

  window.tampilkanNotifikasi = function(title, desc, isError = false) {
    const toast = document.createElement('div');
    const color = isError ? 'error' : 'primary';
    const icon = isError ? 'error' : 'check_circle';
    toast.className = `fixed top-6 left-1/2 -translate-x-1/2 z-[99999] bg-surface-container-lowest border-l-4 border-${color} p-4 rounded-xl shadow-2xl flex flex-col gap-1 w-80 animate-fade-in-up transition-opacity duration-300`;
    toast.innerHTML = `
      <div class="flex items-center gap-2 text-${color} font-bold text-sm uppercase tracking-wider">
         <span class="material-symbols-outlined text-lg">${icon}</span>
         <span>${title}</span>
      </div>
      <p class="text-sm text-on-surface-variant font-medium">${desc}</p>
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
       toast.style.opacity = '0';
       setTimeout(() => toast.remove(), 300);
    }, 2000);
  };

  window.approveRequest = async function(id) {
    const token = await checkAuth('HR'); if(!token) return;
    try {
      const res = await fetch(API_URL + '/admin/leaves/' + id + '/approve', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      if(res.ok) { alert('✅ Pengajuan Berhasil Disetujui!'); window.location.reload(); }
    } catch(e) {}
  };
  window.rejectRequest = async function(id) {
    const token = await checkAuth('HR'); if(!token) return;
    try {
      const res = await fetch(API_URL + '/admin/leaves/' + id + '/reject', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      if(res.ok) { alert('❌ Pengajuan Telah Ditolak!'); window.location.reload(); }
    } catch(e) {}
  };

  const fileInput = document.getElementById('fileInput');
  if (fileInput) {
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        document.getElementById('fileNameText').textContent = e.target.files[0].name;
        document.getElementById('uploadedFileName').classList.remove('hidden');
        document.getElementById('uploadedFileName').classList.add('flex');
        const reader = new FileReader();
        reader.onload = (event) => { base64File = event.target.result; };
        reader.readAsDataURL(e.target.files[0]);
      }
    });
  }
  window.clearFile = function(e) {
    if (e) e.stopPropagation();
    if (fileInput) fileInput.value = '';
    base64File = null;
    document.getElementById('uploadedFileName').classList.add('hidden');
    document.getElementById('uploadedFileName').classList.remove('flex');
  };

  document.body.addEventListener('click', async (e) => {
    const el = e.target.closest('button, a');
    if (!el) return;
    if (el.hasAttribute('onclick') && el.getAttribute('onclick').includes('Request')) return; 

    const text = el.textContent.toLowerCase();
    
    // NOTIFIKASI BELL
    const isNotifBtn = el.getAttribute('aria-label') === 'Notifikasi' || el.closest('button[aria-label="Notifikasi"]');
    if (isNotifBtn) {
       e.preventDefault();
       const notifBtn = el.getAttribute('aria-label') === 'Notifikasi' ? el : el.closest('button[aria-label="Notifikasi"]');
       let dropdown = document.getElementById('notifDropdown');
       
       if (dropdown) {
         dropdown.remove();
       } else {
         dropdown = document.createElement('div');
         dropdown.id = 'notifDropdown';
         dropdown.className = 'fixed top-16 right-4 sm:right-8 w-80 bg-surface-container-lowest shadow-lg rounded-xl border border-surface-container overflow-hidden z-[9999] transition-all transform opacity-100 translate-y-0';
         dropdown.style.animation = 'slideInRight 0.3s ease-out';
         
         try {
           const res = await fetch(API_URL + '/announcement');
           const data = await res.json();
           const msg = data.message || 'Tidak ada notifikasi baru.';
           dropdown.innerHTML = `
             <div class="px-4 py-3 border-b border-surface-container bg-surface-container-low flex justify-between items-center">
               <span class="font-bold text-on-surface">Notifikasi Anda</span>
               <span class="text-xs bg-error text-on-error px-2 py-0.5 rounded-full font-bold animate-pulse">1 Baru</span>
             </div>
             <div class="flex flex-col max-h-80 overflow-y-auto">
               <div class="px-4 py-4 hover:bg-surface-container-low transition-colors flex gap-3 cursor-pointer">
                  <div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center shrink-0">
                     <span class="material-symbols-outlined text-lg">campaign</span>
                  </div>
                  <div class="flex flex-col">
                     <span class="font-bold text-sm text-on-surface">Pesan dari Admin / HRD</span>
                     <span class="text-xs text-on-surface-variant mt-1 leading-relaxed">${msg}</span>
                     <span class="text-[10px] text-primary font-semibold mt-1">Baru saja</span>
                  </div>
               </div>
             </div>
           `;
           document.body.appendChild(dropdown);
           
           // Hilangkan titik merah saat diklik
           const redDot = notifBtn.querySelector('.bg-error');
           if(redDot) redDot.style.display = 'none';
         } catch(e) {}
       }
       return;
    }

    // Klik Di Luar Dropdown Notif untuk menutupnya
    if (!isNotifBtn && document.getElementById('notifDropdown') && !el.closest('#notifDropdown')) {
       document.getElementById('notifDropdown').remove();
    }

    // KELUAR / LOGOUT
    if (text.includes('keluar') || el.getAttribute('data-path') === 'keluar') {
      localStorage.removeItem('presensi_admin_token');
      localStorage.removeItem('presensi_token');
      window.location.href = 'login.html';
      return;
    }

    // PENGATURAN PROFIL
    else if (text.includes('pengaturan') || el.getAttribute('data-path') === 'pengaturan') {
      e.preventDefault();
      const token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
      if (!token) return;
      const payload = JSON.parse(atob(token.split('.')[1]));
      
      // Show loading modal briefly

      modal.className = 'fixed inset-0 z-[99999] bg-inverse-surface/70 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300';

                 <div class="flex flex-col">
                    <label class="text-xs font-bold text-outline uppercase tracking-wider mb-1 block">Foto Profil</label>

                 <input type="text" id="setPass" class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="Masukkan password baru">

          const token = await checkAuth('Employee'); if(!token) return;
          const kioskSelect = document.getElementById('kioskEmployeeSelect');
          const targetUserId = kioskSelect ? kioskSelect.value : null;
          if (kioskSelect && !targetUserId) return alert("❌ Silakan pilih nama Anda terlebih dahulu di kotak pilihan!");
          
          // --- WAKTU CUT-OFF VALIDATION ---
          const cfgTimeCutoff = localStorage.getItem('cfg_time_cutoff') || '11:00';
          const [hCutoff, mCutoff] = cfgTimeCutoff.split(':').map(Number);
          const nowClock = new Date();
          const currentMins = nowClock.getHours() * 60 + nowClock.getMinutes();
          const cutoffMins = hCutoff * 60 + mCutoff;
          
          if (currentMins > cutoffMins) {
              return alert("❌ GAGAL: Anda sudah melewati batas akhir waktu absen masuk (Cut-off: " + cfgTimeCutoff + " WIB).\nAnda tidak diizinkan masuk dan akan tercatat Alpha hari ini.");
          }
          
          // --- GEOFENCING VALIDATION ---
          const officeLat = parseFloat(localStorage.getItem('cfg_office_lat') || '-6.225014');
          const officeLng = parseFloat(localStorage.getItem('cfg_office_lng') || '106.808006');
          const maxRadius = parseFloat(localStorage.getItem('cfg_office_radius') || '50');
          const allowWfh = localStorage.getItem('cfg_allow_wfh') === 'true';
          
          let currentLat = window.globalLat || -6.225014;
          let currentLng = window.globalLng || 106.808006;
          
          const getDist = (lat1, lon1, lat2, lon2) => {
              const R = 6371e3;
              const p1 = lat1 * Math.PI/180;
              const p2 = lat2 * Math.PI/180;
              const dp = (lat2-lat1) * Math.PI/180;
              const dl = (lon2-lon1) * Math.PI/180;
              const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              return R * c;
          };
          
          const distanceMeters = getDist(currentLat, currentLng, officeLat, officeLng);
          
          const workModeInput = document.querySelector('input[name="work_mode"]:checked');
          let tipeLokasi = workModeInput ? workModeInput.value : 'WFO';

              let minDistance = distanceMeters;
              if (minDistance <= maxRadius) isNearAnyBranch = true;
              
              let branches = [];
              try { branches = JSON.parse(localStorage.getItem('cfg_branches') || '[]'); } catch(e){}
              
              branches.forEach(b => {
                  const d = getDist(currentLat, currentLng, parseFloat(b.lat), parseFloat(b.lng));
                  if (d <= parseFloat(b.rad)) isNearAnyBranch = true;
                  minDistance = Math.min(minDistance, d);
              });
              
              if (!isNearAnyBranch && !allowWfh) {
                  return alert("❌ GAGAL: Lokasi Anda di luar jangkauan radius seluruh titik Cabang/Kantor!\n\nJarak terdekat: " + Math.round(minDistance) + " meter.");

  // Helper untuk update Dashboard Element
  async function updateDashboardData(userId, userName, token) {
    const h1 = document.querySelector('h1');
    if (h1 && userName) {
      const hour = new Date().getHours();
      let greeting = 'Selamat Pagi';
      if (hour >= 11 && hour < 15) greeting = 'Selamat Siang';

      else if (hour >= 18) greeting = 'Selamat Malam';
      h1.innerHTML = greeting + ', ' + userName + '! <span class="text-xl">👋</span>';
    }

    // Update Waktu Shift Dinamis
    const cfgIn = localStorage.getItem('cfg_time_in') || '08:30';
    const cfgOut = localStorage.getItem('cfg_time_out') || '17:30';
    const elShift = document.getElementById('shiftText');
    if (elShift) {
        elShift.innerText = 'Shift Reguler (' + cfgIn + ' - ' + cfgOut + ' WIB)';
    }

    // Update Ringkasan Header
    document.querySelectorAll('h2').forEach(h2 => {
      if (h2.innerText.includes('Ringkasan Bulan Ini')) {
         h2.innerText = userName ? 'Ringkasan Bulan Ini: ' + userName : 'Ringkasan Bulan Ini';
      }
    });

    // Update 4 KPI Cards
    try {
      const cfgQuota = localStorage.getItem('cfg_leave_quota') || '12';
      const url = userId ? API_URL + '/attendance/summary?user_id=' + userId + '&quota=' + cfgQuota : API_URL + '/attendance/summary?quota=' + cfgQuota;
      const resStats = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      const stats = await resStats.json();
      
      const kpis = document.querySelectorAll('.bg-surface-container-lowest.rounded-xl.p-5');
      kpis.forEach(kpi => {
        const titleSpan = kpi.querySelector('span.uppercase');
        if(!titleSpan) return;
        const title = titleSpan.innerText.toLowerCase();

             const tgl = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
             const nama = log.user?.nama || 'Karyawan';

             const masuk = log.jam_masuk ? new Date(log.jam_masuk).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) + ' WIB' : '-';
             const pulang = log.jam_pulang ? new Date(log.jam_pulang).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) + ' WIB' : '-';

                 <td class="py-3.5 px-4 font-data-mono text-data-mono text-on-surface">${totalJam}</td>

                     m.className = 'fixed inset-0 z-[99999] bg-inverse-surface/70 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300 animate-fade-in-up';
                     m.innerHTML = `
                       <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-md p-6 flex flex-col gap-4 text-center items-center overflow-hidden relative">
                          <div class="w-full flex justify-between items-center mb-1">
                             <h3 class="font-headline-sm font-bold text-on-surface flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary">my_location</span> Peta Real-Time
                             </h3>
                             <button type="button" id="btnCloseLocDetail" class="text-outline hover:text-on-surface transition-colors"><span class="material-symbols-outlined">close</span></button>
                          </div>
                          
                          <div class="w-full h-48 rounded-2xl overflow-hidden bg-surface-container-high relative border border-surface-container shadow-inner">
                             <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" 
                             src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.003},${lat-0.003},${lon+0.003},${lat+0.003}&layer=mapnik&marker=${lat},${lon}" 
                             style="border: none; pointer-events: none;"></iframe>
                          </div>
                          
                          <div class="w-full flex flex-col text-left gap-1 bg-surface-container-low p-4 rounded-2xl border border-surface-container">
                             <span class="text-xs font-bold uppercase tracking-wider text-outline mb-1">Alamat Terkini</span>

                             <div class="mt-3 pt-3 border-t border-surface-container flex gap-6">

                                <div class="flex flex-col">

                     document.body.appendChild(m);
                     document.getElementById('btnCloseLocDetail').onclick = () => m.remove();
                     m.onclick = (e) => { if(e.target === m) m.remove(); };
                  };
                  
                  if(geoSub) {
                     geoSub.innerHTML = 'Lokasi (Live): <strong class="text-primary group-hover:underline cursor-pointer">' + lokasiText + '</strong> <span class="w-2 h-2 rounded-full bg-primary animate-pulse inline-block ml-1"></span>';
                     geoSub.style.cursor = 'pointer';

                     geoSub.classList.add('group');

                  const topAddr = document.getElementById('userAddressTop');
                  if (topAddr) {
                     topAddr.innerText = lokasiText;
                     const parent = topAddr.parentElement;
                     if(parent) {
                        parent.style.cursor = 'pointer';
                        parent.classList.add('hover:text-primary', 'transition-colors');
                        parent.onclick = showLocModal;
                     }
                  }

                  // Update Validation Card (Riwayat Page)
                  const cardTitikAbsen = document.getElementById('card-titik-absen');
                  if (cardTitikAbsen) cardTitikAbsen.innerText = lokasiText;
                  
                  const cardPresisi = document.getElementById('card-presisi');
                  
                  if (cardPresisi) {
                     const offLat = parseFloat(localStorage.getItem('cfg_office_lat') || '-6.225014');
                     const offLng = parseFloat(localStorage.getItem('cfg_office_lng') || '106.808006');
                     const maxRad = parseFloat(localStorage.getItem('cfg_office_radius') || '50');
                     const wfh = localStorage.getItem('cfg_allow_wfh') === 'true';
                     
                     const getD = (lat1, lon1, lat2, lon2) => {
                         const R = 6371e3;
                         const p1 = lat1 * Math.PI/180;
                         const p2 = lat2 * Math.PI/180;
                         const dp = (lat2-lat1) * Math.PI/180;
                         const dl = (lon2-lon1) * Math.PI/180;
                         const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
                         const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                         return R * c;
                     };
                     const dist = getD(lat, lon, offLat, offLng);
                     
                     if (dist <= maxRad) {
                         cardPresisi.innerText = '✅ Jarak: ' + Math.round(dist) + 'm (Di Dalam Radius)';
                     } else if (wfh) {
                         cardPresisi.innerText = '✅ WFH Aktif (Jarak: ' + Math.round(dist) + 'm)';
                     } else {
                         cardPresisi.innerText = '❌ Di Luar Radius (' + Math.round(dist) + 'm / Max ' + maxRad + 'm)';
                     }
                  }


                  const cardMap = document.getElementById('card-map-container');
                  if (cardMap && !document.getElementById('live-gmap-iframe')) {
                      cardMap.style.backgroundImage = 'none';
                      const iframe = document.createElement('iframe');
                      iframe.id = 'live-gmap-iframe';
                      iframe.style.position = 'absolute';
                      iframe.style.inset = '0';
                      iframe.style.width = '100%';
                      iframe.style.height = '100%';
                      iframe.style.border = '0';
                      iframe.style.zIndex = '0';
                      iframe.src = 'https://maps.google.com/maps?q=' + lat + ',' + lon + '&z=16&output=embed';
                      // Insert before the gradient overlay (which is the first child)
                      cardMap.insertBefore(iframe, cardMap.firstChild);
                  } else if (document.getElementById('live-gmap-iframe')) {
                      document.getElementById('live-gmap-iframe').src = 'https://maps.google.com/maps?q=' + lat + ',' + lon + '&z=16&output=embed';
                  }

                  
                  const cardPerangkat = document.getElementById('card-perangkat');
                  if (cardPerangkat) {
                      let ua = navigator.userAgent;
                      let device = 'Desktop';
                      if (/Mobi|Android/i.test(ua)) device = 'Mobile';
                      
                      let browser = 'Unknown Browser';
                      if (ua.includes('Edg/')) browser = 'Edge';
                      else if (ua.includes('Chrome/')) browser = 'Chrome';
                      else if (ua.includes('Firefox/')) browser = 'Firefox';
                      else if (ua.includes('Safari/')) browser = 'Safari';
                      
                      cardPerangkat.innerText = device + ' (' + browser + ')';
                  }
                  
                  const cardIp = document.getElementById('card-ip');
                  if (cardIp && cardIp.innerText.includes('Mendeteksi')) {
                      cardIp.innerText = 'Mengambil IP...';
                      fetch('https://api.ipify.org?format=json')

                         .then(d => cardIp.innerText = d.ip + ' (Public)')

                      topText = 'Izin Browser Diblokir';
                  } else if (err.code === 2) {
                      errReason = 'Sinyal GPS Tidak Ditemukan (Position Unavailable)';
                      topText = 'Sinyal GPS Hilang';
                  } else if (err.code === 3) {
                      errReason = 'Pencarian Lokasi Timeout (Sinyal Lemah)';
                      topText = 'GPS Timeout';
                  }
                  
                  if(geoSub) geoSub.innerHTML = '<strong class="text-error">' + errReason + '</strong>';
                  const topAddr = document.getElementById('userAddressTop');
                  if(topAddr) topAddr.innerText = topText;
                  const badgeAddr = document.getElementById('userAddressBadge');
                  if(badgeAddr) badgeAddr.innerText = 'Error ' + err.code;

                  const cardTitikAbsen = document.getElementById('card-titik-absen');
                  if (cardTitikAbsen) cardTitikAbsen.innerText = errReason;
                  
                  const cardStatus = document.querySelector('.bg-secondary-fixed.text-on-secondary-fixed');
                  if (cardStatus && cardStatus.innerText.includes('GPS')) {
                      cardStatus.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-label-sm text-label-sm font-semibold';
                      cardStatus.innerHTML = '<span class="material-symbols-outlined text-sm">location_off</span> GPS Gagal';
                  }

               },
               { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
             );
          } else {
             if(geoSub) geoSub.innerText = 'GPS tidak didukung.';
          }
       };

       const checkAndPromptLocation = () => {
          const hasAgreed = localStorage.getItem('presensi_loc_agreed_v2');
          if (!hasAgreed) {
             const locModal = document.createElement('div');
             locModal.className = 'fixed inset-0 z-[99999] bg-inverse-surface/70 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300 animate-fade-in-up';
             locModal.innerHTML = `
               <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-sm p-7 flex flex-col gap-4 text-center items-center">
                  <div class="w-16 h-16 rounded-full bg-primary-container text-primary flex items-center justify-center mb-1 shadow-inner relative overflow-hidden">

                  <p class="text-sm text-on-surface-variant font-medium leading-relaxed">
                     Sistem <b>PresensiKu</b> membutuhkan izin Anda untuk melacak koordinat GPS secara <i class="text-primary font-bold">real-time</i> saat melakukan absensi masuk & pulang.
                  </p>
                  <div class="w-full flex gap-3 mt-2">
                     <button type="button" id="btnDenyLoc" class="flex-1 py-3.5 rounded-xl font-bold text-on-surface bg-surface-container hover:bg-surface-container-high transition-colors shadow-sm">Tolak</button>
                     <button type="button" id="btnAllowLoc" class="flex-1 py-3.5 rounded-xl font-bold text-on-primary bg-primary hover:opacity-90 active:scale-95 transition-all shadow-md">Setuju</button>
                  </div>
               </div>
             `;
             document.body.appendChild(locModal);

             document.getElementById('btnDenyLoc').onclick = () => {

             };

             fetchAndSetLocation();
          }

       checkAndPromptLocation();
    }

       // --- CALIBRATE GPS BUTTON LOGIC ---
       setTimeout(() => {
           const calibBtn = Array.from(document.querySelectorAll('button')).find(el => el.innerText.includes('Kalibrasi GPS'));
           if (calibBtn) {
               calibBtn.onclick = () => {
                   if (!navigator.geolocation) return alert('Perangkat tidak mendukung GPS.');
                   
                   const originalHtml = calibBtn.innerHTML;
                   calibBtn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin" style="animation: spin 1s linear infinite;">sync</span><span>Mengkalibrasi...</span>';
                   calibBtn.disabled = true;
                   
                   navigator.geolocation.getCurrentPosition(
                       (pos) => {
                           window.globalLat = pos.coords.latitude;
                           window.globalLng = pos.coords.longitude;
                           
                           const localDist = (lat1, lon1, lat2, lon2) => {
                               const R = 6371e3;
                               const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
                               const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
                               const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
                               return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                           };
                           
                           let branches = [];
                           try { branches = JSON.parse(localStorage.getItem('cfg_branches') || '[]'); } catch(e){}
                           
                           let minDistance = localDist(window.globalLat, window.globalLng, parseFloat(localStorage.getItem('cfg_office_lat') || '-6.225014'), parseFloat(localStorage.getItem('cfg_office_lng') || '106.808006'));
                           
                           branches.forEach(b => {
                               minDistance = Math.min(minDistance, localDist(window.globalLat, window.globalLng, parseFloat(b.lat), parseFloat(b.lng)));
                           });
                           
                           alert('✅ Kalibrasi Selesai!\n\nKoordinat Anda berhasil diperbarui menggunakan presisi tertinggi (' + Math.round(pos.coords.accuracy) + 'm).\n\nJarak dengan cabang terdekat saat ini: ' + Math.round(minDistance) + ' meter.');
                           
                           calibBtn.innerHTML = originalHtml;
                           calibBtn.disabled = false;
                       },
                       (err) => {
                           alert('❌ Gagal mengkalibrasi GPS: ' + err.message + '\nPastikan GPS menyala dan Browser diberi izin akses Lokasi.');
                           calibBtn.innerHTML = originalHtml;
                           calibBtn.disabled = false;
                       },
                       { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }

      // Fetch Announcement

              toast.style.animation = 'slideInRight 0.5s ease-out';
              toast.innerHTML = `

                <p class="text-sm font-body-sm text-on-surface-variant">${latestAnnounce.message}</p>
              `;
              document.body.appendChild(toast);
              
              // Auto-close setelah 10 detik
              setTimeout(() => { 
                 if(toast.parentElement) {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                 }
              }, 10000);
  
              localStorage.setItem('last_announcement', latestAnnounce.message);
           }
         }
  
         document.querySelectorAll('h3').forEach(h3 => {
           if (h3.innerText.includes('Pengumuman HRD')) {
             const headerBox = h3.closest('div.flex.items-center.justify-between');
             if (headerBox) {
               const badge = headerBox.querySelector('span.font-label-sm');
               if (badge) {
                  badge.innerText = Array.isArray(dataAnnounce) && dataAnnounce.length > 0 ? dataAnnounce.length + ' Terkini' : '0 Terkini';
               }
             }
             
               const container = h3.closest('div.bg-surface-container-lowest')?.querySelector('div.divide-y');
               if (container) {
                 if (Array.isArray(dataAnnounce) && dataAnnounce.length > 0) {
                    
                    let isHR = false;

                       const token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
                       if(token) {
                           const payload = JSON.parse(atob(token.split('.')[1]));
                           if(payload.role === 'HR' || payload.role === 'Admin') isHR = true;
                       }
                    } catch(e) {}

                    window.currentAnnouncements = dataAnnounce;

                    // Global Functions for Edit/Delete
                    window.editAnnouncement = async (id) => {
                       const token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
                       const ann = window.currentAnnouncements.find(a => a.id === id);
                       if(!ann) return;
                       
                       const newMessage = prompt('Edit Pengumuman:', ann.message);
                       if (newMessage && newMessage !== ann.message) {
                          try {
                             const r = await fetch(API_URL + '/admin/announcement/' + id, { 
                                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify({ message: newMessage })
                             });
                             if(r.ok) location.reload();
                          } catch(e){}
                       }
                    };

                    window.deleteAnnouncement = async (id) => {
                       if (confirm('Yakin ingin menghapus pengumuman ini?')) {
                          const token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
                          try {
                             const r = await fetch(API_URL + '/admin/announcement/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
                             if(r.ok) location.reload();

                       }
                    };

                    container.innerHTML = '';
                    dataAnnounce.forEach((ann) => {
                       const dateObj = new Date(ann.createdAt);
                       const now = new Date();
                       let timeText = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                       if (dateObj.toDateString() === now.toDateString()) {
                          timeText = 'Hari ini, ' + dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                       } else {
                          const yesterday = new Date();
                          yesterday.setDate(yesterday.getDate() - 1);

                             timeText = 'Kemarin, ' + dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

               }
             }
         });
      } catch(e) {}

      

    // INIT PERSONAL DASHBOARD (Non-Kiosk)
    if (pageText.includes('Catat Kehadiran') || pageText.includes('Clock In')) {
       const token = await checkAuth('Employee'); if(!token) return;
       try {
         // Decode token untuk dapatkan userId
         const payload = JSON.parse(atob(token.split('.')[1]));
         const userId = payload.id;

         // Fetch data user untuk dapat nama asli
         const resUsers = await fetch(API_URL + '/users');
         const users = await resUsers.json();
         const me = users.find(u => u.id === userId);
         const userName = me ? me.nama : 'Karyawan';

         // Update dashboard menggunakan data personal
         updateDashboardData(userId, userName, token);
         
         
         


         
         // --- NOTION-STYLE ONBOARDING COACHMARKS ---
         window.startNotionTour = () => {
             if (localStorage.getItem('tutorial_notion_v4')) return;
             setTimeout(() => {
                 const getTarget = (id) => {
                     if (id === 'clockIn') return document.getElementById('btnClockIn') || document.getElementById('btnClockOut');
                     if (id === 'workMode') return document.getElementById('workModeSegment');
                     if (id === 'riwayat') return Array.from(document.querySelectorAll('a')).find(a => a.href && a.href.includes('riwayat.html') && a.offsetParent !== null);
                     if (id === 'izin') return Array.from(document.querySelectorAll('a')).find(a => a.href && a.href.includes('izin.html') && a.offsetParent !== null);
                     return null;
                 };

                 const steps = [
                     { id: 'clockIn', title: 'Tombol Absen Utama', desc: 'Tekan tombol ini saat Anda mulai bekerja. Sistem akan memvalidasi radius lokasi dan wajah Anda secara otomatis.', pos: 'top' },
                     { id: 'workMode', title: 'Pilih Mode Kerja', desc: 'Sistem mendukung WFO, WFH, dan Dinas Luar. Pilih mode yang sesuai dengan kondisi Anda hari ini.', pos: 'bottom' },
                     { id: 'riwayat', title: 'Pantau Kehadiran', desc: 'Menu ini berisi catatan jam kedatangan, keterlambatan, dan rekap gaji/absensi Anda bulan ini.', pos: 'top' },
                     { id: 'izin', title: 'Pengajuan Cuti & Izin', desc: 'Sedang tidak enak badan? Anda bisa mengajukan izin sakit atau cuti langsung melalui menu ini.', pos: 'top' }
                 ];

                 let currentStep = 0;
                 
                 const overlay = document.createElement('div');
                 overlay.className = 'fixed inset-0 z-[99998] bg-slate-900/40 opacity-0 transition-opacity duration-500 pointer-events-auto';
                 document.body.appendChild(overlay);

                 const highlight = document.createElement('div');
                 highlight.className = 'fixed z-[99999] rounded-2xl ring-4 ring-blue-500/50 bg-transparent pointer-events-none transition-opacity duration-300 shadow-[0_0_0_9999px_rgba(15,23,42,0.4)]';
                 document.body.appendChild(highlight);

                 const tooltip = document.createElement('div');
                 tooltip.className = 'fixed z-[100000] bg-white border border-slate-100 shadow-2xl rounded-2xl p-4 w-72 flex flex-col gap-3 transition-opacity duration-300 opacity-0';
                 document.body.appendChild(tooltip);

                 const renderStep = () => {
                     const step = steps[currentStep];
                     const target = getTarget(step.id);
                     
                     if (!target) {
                         if (currentStep < steps.length - 1) { currentStep++; renderStep(); }
                         else endTour();
                         return;
                     }

                     target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                     
                     if (window.tourInterval) cancelAnimationFrame(window.tourInterval);
                     const updatePos = () => {
                         if (!document.body.contains(highlight)) return;
                         const t = getTarget(steps[currentStep].id);
                         if(t) {
                             const r = t.getBoundingClientRect();
                             highlight.style.top = (r.top - 8) + 'px';
                             highlight.style.left = (r.left - 8) + 'px';
                             highlight.style.width = (r.width + 16) + 'px';
                             highlight.style.height = (r.height + 16) + 'px';
                             
                             let tTop, tLeft;
                             const tHeight = tooltip.offsetHeight || 140;
                             if (steps[currentStep].pos === 'top') {
                                 tTop = r.top - tHeight - 20;
                                 if (tTop < 20) tTop = r.bottom + 20;
                             } else {
                                 tTop = r.bottom + 20;
                                 if (tTop + tHeight > window.innerHeight) tTop = r.top - tHeight - 20;
                             }
                             tLeft = r.left + (r.width / 2) - 144;

                           btns[4].innerText = 'WFH (' + countWFH + ')';
                           

                           btns.forEach(b => {
                               const bText = b.innerText.split(' (')[0];
                               if (bText === currentFilterStatus) {
                                   b.className = 'px-3 py-1.5 rounded-xl bg-primary-container text-on-primary font-label-sm text-label-sm font-semibold shadow-sm whitespace-nowrap shrink-0 filter-btn';
                               } else {
                                   b.className = 'px-3 py-1.5 rounded-xl bg-surface-container-low text-on-surface-variant hover:bg-surface-container font-label-sm text-label-sm whitespace-nowrap shrink-0 filter-btn';
                               }
                               b.onclick = () => {
                                    currentFilterStatus = bText;
                                    renderTimesheet();
                               };
                           });
                       }
                   }

                   
                   

                   
                   // --- UPDATE KPI CARDS (MONTHLY) ---
                   try {
                       const monthData = rawHistData.filter(d => {
                           const dt = new Date(d.tanggal);
                           return (monthsStr[dt.getMonth()] + ' ' + dt.getFullYear()) === selectedPeriod;
                       });
                       
                       // Calculate actual working days in the selected month
                       const dtParts = selectedPeriod.split(' ');
                       const mName = dtParts[0];
                       const yNum = parseInt(dtParts[1]);
                       const mNum = monthsStr.indexOf(mName);

                       let actualWorkDays = 0;
                       if (mNum >= 0 && !isNaN(yNum)) {
                           const daysInMonth = new Date(yNum, mNum + 1, 0).getDate();
                           for (let i = 1; i <= daysInMonth; i++) {
                               const day = new Date(yNum, mNum, i).getDay();
                               if (day !== 0 && day !== 6) actualWorkDays++; // Exclude Sat/Sun
                           }
                       }
                       const totalWorkDays = actualWorkDays > 0 ? actualWorkDays : 22; // Fallback to 22 if parse fails
                       
                       let hadirs = 0;
                       let terlambat = 0;
                       let totalMins = 0;
                       let countJamMasuk = 0;
                       
                       monthData.forEach(d => {
                           if (d.status_kehadiran === 'Tepat Waktu' || d.status_kehadiran.includes('Terlambat')) hadirs++;
                           if (d.status_kehadiran.includes('Terlambat')) terlambat++;
                           
                           if (d.jam_masuk) {
                               const t = new Date(d.jam_masuk);
                               totalMins += (t.getHours() * 60) + t.getMinutes();
                               countJamMasuk++;
                           }
                       });
                       
                       // Update KPI 1: Kehadiran
                       const pct = Math.round((hadirs / totalWorkDays) * 100);
                       const elPct = document.getElementById('kpi-kehadiran-pct');
                       if (elPct) elPct.innerText = pct + '%';
                       
                       const elFrac = document.getElementById('kpi-kehadiran-fraction');
                       if (elFrac) elFrac.innerText = hadirs + '/' + totalWorkDays;
                       
                       const elRing = document.getElementById('kpi-kehadiran-ring');
                       if (elRing) {
                           elRing.setAttribute('stroke-dasharray', pct + ', 100');
                           elRing.setAttribute('class', pct >= 95 ? 'text-secondary transition-all duration-1000' : 'text-error transition-all duration-1000');
                       }
                       
                       const elStatus = document.getElementById('kpi-kehadiran-status');
                       if (elStatus) {
                           if (pct >= 95) {
                               elStatus.innerText = 'Tercapai';
                               elStatus.className = 'inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm font-semibold';
                           } else if (hadirs === 0) {
                               elStatus.innerText = 'Belum Ada';
                               elStatus.className = 'inline-flex items-center px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm font-semibold';
                           } else {
                               elStatus.innerText = 'Di Bawah Target';
                               elStatus.className = 'inline-flex items-center px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-label-sm text-label-sm font-semibold';
                           }
                       }
                       
                       const elText = document.getElementById('kpi-kehadiran-text');
                       if (elText) {
                           const absenDays = totalWorkDays - hadirs;
                           elText.innerText = absenDays > 0 ? (absenDays + ' Hari Tidak Hadir / Absen') : 'Hadir Penuh (Kepatuhan 100%)';
                       }
                       
                       // Update KPI 3: Rata-rata Masuk
                       let avgStr = '--:--';
                       let isLate = false;
                       let diffText = 'Belum ada data absensi';
                       let ringPct = 0;
                       
                       if (countJamMasuk > 0) {
                           const avgMins = Math.floor(totalMins / countJamMasuk);
                           const h = Math.floor(avgMins / 60).toString().padStart(2, '0');
                           const m = (avgMins % 60).toString().padStart(2, '0');
                           avgStr = h + ':' + m;
                           
                           const cfgTime = localStorage.getItem('cfg_time_in') || '08:30';
                           const [hCfg, mCfg] = cfgTime.split(':').map(Number);
                           const targetMins = (hCfg * 60) + mCfg;
                           if (avgMins > targetMins) {
                               isLate = true;
                               diffText = (avgMins - targetMins) + ' Menit Terlambat';
                               ringPct = 100; // Full red
                           } else {
                               isLate = false;
                               diffText = (targetMins - avgMins) + ' Menit Awal';
                               ringPct = Math.max(0, 100 - ((targetMins - avgMins) / 30 * 100)); // Just visual scale
                           }
                       }
                       
                       const elAvg = document.getElementById('kpi-avg-masuk');
                       if (elAvg) {
                           elAvg.innerText = avgStr;
                           elAvg.className = isLate ? 'font-display-lg text-display-lg font-data-mono text-error font-bold tracking-tight' : 'font-display-lg text-display-lg font-data-mono text-primary font-bold tracking-tight';
                       }
                       
                       const elAvgText = document.getElementById('kpi-avg-awal');
                       if (elAvgText) {
                           const elBatas = document.getElementById('batasJamText');
                           if(elBatas) elBatas.innerText = 'Batas jam kantor: ' + cfgTime + ' WIB';
                           elAvgText.innerText = diffText;
                           elAvgText.parentElement.className = isLate ? 'inline-flex items-center gap-1 font-label-sm text-label-sm text-error font-semibold' : 'inline-flex items-center gap-1 font-label-sm text-label-sm text-secondary font-semibold';
                       }
                       
                       const elAvgIcon = document.getElementById('kpi-avg-icon');
                       if (elAvgIcon) elAvgIcon.innerText = isLate ? 'warning' : 'check_circle';
                       
                       const elTerlambat = document.getElementById('kpi-avg-terlambat');
                       if (elTerlambat) elTerlambat.innerText = terlambat + 'x Terlambat bulan ini';
                       
                       const elAvgRing = document.getElementById('kpi-avg-ring');
                       if (elAvgRing) {
                           elAvgRing.style.width = (countJamMasuk === 0 ? 0 : (isLate ? 100 : ringPct)) + '%';
                           elAvgRing.className = isLate ? 'bg-error h-full rounded-full transition-all duration-1000' : 'bg-secondary h-full rounded-full transition-all duration-1000';
                       }
                       
                   } catch(e) {}

                   if (currentFilterStatus !== 'Semua') {
                       filteredData = filteredData.filter(d => {
                           if (currentFilterStatus === 'Hadir') return d.status_kehadiran === 'Tepat Waktu' || d.status_kehadiran.includes('Terlambat');
                           if (currentFilterStatus === 'Terlambat') return d.status_kehadiran.includes('Terlambat');
                           if (currentFilterStatus === 'WFH') return d.tipe_lokasi === 'WFH';
                           return false;
                       });
                   }

                   if (counterBadge) counterBadge.innerText = filteredData.length + ' Catatan Karyawan';
                   tableBody.innerHTML = '';

                   if (filteredData.length === 0) {
                      tableBody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-outline italic">Belum ada catatan kehadiran pada filter ini.</td></tr>';
                   } else {
                      filteredData.forEach(item => {
                         const d = new Date(item.tanggal);
                         const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                         const monthsShort = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
                         let dayName = days[d.getDay()];
                         if (d.toDateString() === new Date().toDateString()) dayName += ' (Hari Ini)';
                         const tglStr = d.getDate() + ' ' + monthsShort[d.getMonth()] + ' ' + d.getFullYear();
                         
                         const timeIn = item.jam_masuk ? new Date(item.jam_masuk).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '-';
                         const timeOut = item.jam_pulang ? new Date(item.jam_pulang).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : 'Bekerja...';
                         
                         let statusColor = 'bg-secondary-fixed text-on-secondary-fixed';
                         let icon = 'check_circle';
                         if (item.status_kehadiran.includes('Terlambat')) {
                             statusColor = 'bg-tertiary-fixed text-on-tertiary-fixed';
                             icon = 'warning';
                         } else if (item.status_kehadiran === 'Absen' || item.status_kehadiran === 'Tidak Hadir') {
                             statusColor = 'bg-error-container text-error';
                             icon = 'cancel';
                         }
                         
                         let totalJam = '-';
                         if (item.jam_masuk && item.jam_pulang) {
                             const diffMs = new Date(item.jam_pulang) - new Date(item.jam_masuk);
                             totalJam = Math.floor(diffMs / (1000 * 60 * 60)) + 'j ' + Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)) + 'm';
                         } else if (item.jam_masuk) {
                             const diffMs = new Date() - new Date(item.jam_masuk);
                             totalJam = Math.floor(diffMs / (1000 * 60 * 60)) + 'j ' + Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)) + 'm';
                         }
                         
                         const authorAvatar = item.user?.avatar || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzlDQTNBRiI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';
                         const authorName = item.user?.nama || 'Karyawan';
                         
                         const actualFoto = item.foto_bukti_masuk || authorAvatar;
                         const safeUrl = actualFoto.replace(/'/g, "\\\'").replace(/"/g, '&quot;');
                         const safeName = authorName.replace(/'/g, "\\\'").replace(/"/g, '&quot;');

                         tableBody.innerHTML += '<tr class="hover:bg-surface-container-low transition-colors bg-surface-container-lowest"><td class="py-3.5 px-4 whitespace-nowrap"><div class="flex flex-col"><span class="font-semibold text-on-surface font-label-md text-label-md">' + tglStr + '</span><span class="text-outline text-xs">' + dayName + '</span></div></td><td class="py-3.5 px-4 whitespace-nowrap"><div class="flex items-center gap-2"><img class="w-7 h-7 rounded-full object-cover shadow-xs shrink-0" src="' + authorAvatar + '"/><div class="flex flex-col"><span class="font-data-mono text-data-mono font-bold text-on-surface">' + timeIn + '</span><span class="text-[11px] text-outline">' + authorName + '</span></div></div></td><td class="py-3.5 px-4 whitespace-nowrap"><span class="inline-flex items-center gap-1 font-data-mono text-data-mono text-primary font-semibold">' + (timeOut === 'Bekerja...' ? '<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span> Bekerja...' : timeOut) + '</span></td><td class="py-3.5 px-4 whitespace-nowrap"><span class="font-data-mono text-data-mono font-semibold text-on-surface">' + totalJam + '</span></td><td class="py-3.5 px-4 whitespace-nowrap"><span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full ' + statusColor + ' font-label-sm text-label-sm font-semibold"><span class="material-symbols-outlined text-xs">' + icon + '</span> ' + item.status_kehadiran + '</span></td><td class="py-3.5 px-4 whitespace-nowrap text-center"><button onclick="showDetailModal(\'' + safeUrl + '\', \'' + safeName + '\')" class="p-1.5 rounded-lg text-outline hover:text-primary hover:bg-surface-container transition-all" title="Lihat Foto Upload" type="button"><span class="material-symbols-outlined text-lg">visibility</span></button></td></tr>';
                      });
                   }
               };

               if (periodSelect) {
                   periodSelect.onchange = renderTimesheet;
               }
               renderTimesheet();
            } // close if (tableBody)
          } catch(e) {}

      // 3. Mini Calendar Widget Logic
      try {
          const initMiniCalendar = () => {
             const calWidget = document.getElementById('miniCalendarWidget');
             if (!calWidget) return;
             
             let currentDate = new Date(); 
             
             // Setup global selected date if not exists
             if (typeof window.selectedDateFilter === 'undefined') {
                 window.selectedDateFilter = null;
             }
             
             window.setCalFilter = (y, m, d) => {
                 const targetDate = new Date(y, m, d);
                 if (window.selectedDateFilter && window.selectedDateFilter.toDateString() === targetDate.toDateString()) {
                     window.selectedDateFilter = null; // Toggle off
                 } else {
                     window.selectedDateFilter = targetDate; // Toggle on
                 }
                 renderCal();
                 if (window.renderTimesheetCustom) {
                     window.renderTimesheetCustom();
                 }
             };

             const renderCal = () => {
                 const year = currentDate.getFullYear();
                 const month = currentDate.getMonth(); 
                 
                 const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                 const monthName = monthNames[month];
                 
                 const today = new Date();
                 const isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
                 const activeBadge = isCurrentMonth ? '<span class="font-label-sm text-label-sm px-2 py-0.5 rounded bg-surface-container text-primary font-semibold">Bulan Ini</span>' : '';
                 
                 let headerHtml = '<div class="flex items-center justify-between">' +
                      '<div class="flex items-center gap-2">' +
                        '<span class="font-headline-sm text-headline-sm font-bold text-on-surface">' + monthName + ' ' + year + '</span>' +
                        activeBadge +
                      '</div>' +
                      '<div class="flex items-center gap-1">' +
                        '<button id="calPrevBtn" class="p-1 rounded-lg hover:bg-surface-container text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-lg leading-none">chevron_left</span></button>' +
                        '<button id="calNextBtn" class="p-1 rounded-lg hover:bg-surface-container text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-lg leading-none">chevron_right</span></button>' +
                      '</div>' +
                    '</div>' +
                    '<div class="grid grid-cols-7 gap-1 text-center mt-2">' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Min</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Sen</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Sel</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Rab</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Kam</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Jum</span>' +
                      '<span class="font-label-sm text-label-sm text-outline py-1 font-semibold">Sab</span>' +
                    '</div>';
                 
                 let matrixHtml = '<div class="grid grid-cols-7 gap-1 text-center">';
                 
                 const firstDay = new Date(year, month, 1).getDay();
                 const daysInMonth = new Date(year, month + 1, 0).getDate();
                 const prevDaysInMonth = new Date(year, month, 0).getDate();
                 
                 for (let i = firstDay - 1; i >= 0; i--) {
                     matrixHtml += '<div class="py-2 text-outline/40 font-data-mono text-body-sm">' + (prevDaysInMonth - i) + '</div>';
                 }
                 
                 for (let d = 1; d <= daysInMonth; d++) {
                     const isToday = (year === today.getFullYear() && month === today.getMonth() && d === today.getDate());
                     const isWeekend = new Date(year, month, d).getDay() === 0;
                     const isSelected = window.selectedDateFilter && window.selectedDateFilter.getFullYear() === year && window.selectedDateFilter.getMonth() === month && window.selectedDateFilter.getDate() === d;
                     
                     let classes = "relative py-2 rounded-lg font-data-mono text-body-sm cursor-pointer transition-colors";
                     if (isSelected) {
                         classes += " bg-primary text-on-primary font-bold shadow-md ring-2 ring-primary-container ring-offset-2";
                     } else if (isToday) {
                         classes += " bg-primary-container text-on-primary-container font-semibold";
                     } else if (isWeekend) {
                         classes += " bg-surface-container-lowest hover:bg-surface-container text-error font-medium";
                     } else {
                         classes += " hover:bg-surface-container text-on-surface";
                     }
                     
                     matrixHtml += '<div onclick="window.setCalFilter(' + year + ',' + month + ',' + d + ')" class="' + classes + '">' + d + '</div>';
                 }
                 
                 const totalCells = firstDay + daysInMonth;
                 let nextDays = 1;
                 for (let i = totalCells; i < 42; i++) {
                     matrixHtml += '<div class="py-2 text-outline/40 font-data-mono text-body-sm">' + (nextDays++) + '</div>';
                 }
                 
                 matrixHtml += '</div>';
                 
                 let filterMsg = '';
                 if (window.selectedDateFilter) {
                     filterMsg = '<div class="mt-2 text-center"><button onclick="window.setCalFilter(' + year + ',' + month + ',' + window.selectedDateFilter.getDate() + ')" class="text-xs text-primary hover:underline bg-primary/10 px-2 py-1 rounded-full">Menampilkan data tgl ' + window.selectedDateFilter.getDate() + ' ' + monthName + ' (Klik untuk reset)</button></div>';
                 }
                 
                 calWidget.innerHTML = headerHtml + matrixHtml + filterMsg;
                 
                 document.getElementById('calPrevBtn').onclick = () => {
                     currentDate.setMonth(currentDate.getMonth() - 1);
                     renderCal();
                 };
                 document.getElementById('calNextBtn').onclick = () => {
                     currentDate.setMonth(currentDate.getMonth() + 1);
                     renderCal();
                 };
             };
             renderCal();
          };
          initMiniCalendar();
      } catch(e) {}





      } catch(e) {}
    }
  };
  
  
    
    window.logAudit = (action, detail, severity = 'info') => {
        let logs = [];
        try { logs = JSON.parse(localStorage.getItem('sys_audit_logs') || '[]'); } catch(e){}
        const token = localStorage.getItem('presensi_admin_token') || localStorage.getItem('presensi_token');
        let actor = 'System';
        if (token) {
            try { 
                const payload = JSON.parse(atob(token.split('.')[1]));
                actor = payload.nama || payload.role || 'Admin';
            } catch(e){}
        }
        logs.unshift({
            time: new Date().toISOString(),
            actor,
            action,
            detail,
            severity
        });
        if (logs.length > 300) logs = logs.slice(0, 300); // Keep max 300 logs
        localStorage.setItem('sys_audit_logs', JSON.stringify(logs));
    };

    window.clearAuditLogs = () => {
        if(confirm('Yakin ingin membersihkan seluruh riwayat audit keamanan? (Tindakan ini tidak bisa dibatalkan)')) {
            localStorage.setItem('sys_audit_logs', '[]');
            window.loadSAView('audit');
        }
    };


    window.deleteKaryawan = async (id, nama) => {
        if (confirm('⚠️ PERINGATAN KRITIKAL!\n\nApakah Anda yakin ingin MENGHAPUS secara permanen akun karyawan: ' + nama + '?\nSemua riwayat presensi terkait akun ini mungkin akan hilang atau tidak dapat diakses lagi.')) {
            try {
                const res = await fetch(API_URL + '/users/' + id, { method: 'DELETE' });
                if (res.ok) {
                    alert('✅ Akun karyawan berhasil dihapus permanen.');
                    if(window.logAudit) window.logAudit('Penghapusan Akun', 'Menghapus permanen akun pengguna: ' + nama, 'danger');
                    window.loadSAView('db'); // Reload the table
                } else {
                    alert('❌ Gagal menghapus karyawan. Server menolak.');
                }
            } catch(e) {
                alert('❌ Kesalahan jaringan.');
            }
        }
    };



  // ==========================================
  // GLOBAL HEADER CLOCK (RUNS ON ALL PAGES)
  // ==========================================
  const globalTick = () => {
      const now = new Date();
      const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      
      const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
      const tz = localStorage.getItem('cfg_timezone') || 'WIB';
      
      const globalTime = document.getElementById('globalHeaderTime');
      const globalDate = document.getElementById('globalHeaderDate');
      
      if (globalTime) {
          globalTime.innerHTML = timeStr + ' ' + tz;
      }
      if (globalDate) {
          globalDate.innerHTML = '| ' + days[now.getDay()].substring(0,3) + ', ' + now.getDate() + ' ' + months[now.getMonth()];
      }
  };
  globalTick();
  setInterval(globalTick, 1000);


  // Eksekusi fungsi inisialisasi secara langsung!
  initAppUI();

</script>
</body>
